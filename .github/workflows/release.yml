name: Publish release

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - '.github/release-requests/v*.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  validate-and-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          github.event.pull_request.author_association == 'OWNER' ||
          github.event.pull_request.author_association == 'MEMBER' ||
          github.event.pull_request.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ref="${{ github.sha }}"
            file="$(ls RELEASE_NOTES_v*.md 2>/dev/null | sort -V | tail -n 1 || true)"
            if [[ -z "$file" ]]; then
              echo "No versioned release-notes file found."
              exit 1
            fi
            version="${file#RELEASE_NOTES_}"
            version="${version%.md}"
          else
            pr="${{ github.event.pull_request.number }}"
            ref="${{ github.event.pull_request.base.sha }}"
            request_file="$(gh pr view "$pr" --repo "${{ github.repository }}" --json files --jq '.files[].path' | grep -E '^\.github/release-requests/v[0-9]+\.[0-9]+\.[0-9]+\.md$' | sort -V | tail -n 1 || true)"
            if [[ -z "$request_file" ]]; then
              echo "No versioned release-request file found in PR."
              exit 1
            fi
            version="${request_file##*/}"
            version="${version%.md}"
            file="RELEASE_NOTES_${version}.md"
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.request.outputs.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify release notes exist on merged baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ steps.request.outputs.file }}"

      - name: Install validation and harness dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pyyaml jsonschema pytest -e conformance-harness

      - name: Run complete validation suite
        run: python scripts/validate_all.py --evidence-dir results

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          file="${{ steps.request.outputs.file }}"
          tag="${{ steps.request.outputs.version }}"
          title="$(head -n 1 "$file" | sed -E 's/^# +//')"

          if [[ -z "$title" ]]; then
            echo "Release title could not be derived from $file"
            exit 1
          fi

          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.release.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            --target "${{ steps.request.outputs.ref }}" \
            --title "${{ steps.release.outputs.title }}" \
            --notes-file "${{ steps.release.outputs.file }}" \
            --latest

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.release.outputs.tag }}" --json tagName,name,isLatest,isDraft,isPrerelease,url
