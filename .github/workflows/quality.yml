name: Repository quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validation and harness dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pyyaml jsonschema pytest -e conformance-harness
      - name: Run complete validation suite
        run: python scripts/validate_all.py --evidence-dir results
      - name: Upload deterministic conformance evidence
        uses: actions/upload-artifact@v4
        with:
          name: conformance-evidence
          path: results/
