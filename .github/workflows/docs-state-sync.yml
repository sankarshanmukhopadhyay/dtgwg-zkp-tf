name: Synchronize composed-privacy documentation state

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Synchronize canonical documentation summaries
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'README.md',
              '- a decision backlog separating specification choices from construction choices.\n\nIt remains a working draft and deliberately does **not** select a proof system or claim that cryptography proves the correctness of a biometric determination.\n',
              '- a decision backlog separating specification choices from construction choices;\n- composed-presentation privacy over the complete evidence closure; and\n- executable semantic conformance for cross-artifact, hiding-binder and external-resolution privacy predicates.\n\nIt remains a working draft and deliberately does **not** make any experimental proof construction normative or claim that cryptography proves the correctness of a biometric determination.\n\n### Experimental construction pressure tests\n\nThe construction-neutral requirements are now pressure-tested by separate, explicitly non-normative profiles under [`docs/implementation-guide/conformance/`](./docs/implementation-guide/conformance/README.md):\n\n- `EXP-BBS-2023-01` for credential-side selective disclosure and holder-binding capabilities;\n- `EXP-PR-REL-SIGMA-01` for privacy-preserving equality/relationship proofs across authenticated commitments;\n- `EXP-PR-HID-PEDERSEN-01` for randomized confidential binders over low-entropy/enumerable values; and\n- `PR-RES` resolution profiles for cached/shared status evidence, carried snapshots and explicitly declared live lookup.\n\nThese profiles provide construction and conformance evidence without changing the semantic requirements or implying upstream adoption.\n'
          )

          replace(
              'docs/implementation-guide/README.md',
              '| Construction status | Specific proof constructions remain deferred pending the construction-selection gate and independently supportable benchmark evidence |',
              '| Construction status | Construction-neutral requirements remain authoritative in this fork; separate experimental BBS, `PR-REL`, `PR-HID` and `PR-RES` profiles now provide executable pressure-test evidence, but none is normative or production-promoted |'
          )
          replace(
              'docs/implementation-guide/README.md',
              'The two most load-bearing working positions remain context delimitation and the issuer-verifier collusion target. Discussion #13 moves them from open questions to adopted working positions for v0.4; construction selection remains downstream of their evidence-backed application and the construction-selection gate.',
              'The two most load-bearing working positions remain context delimitation and the issuer-verifier collusion target. Discussion #13 moves them from open questions to adopted working positions for v0.4. Governed production construction selection remains downstream of their evidence-backed application; experimental construction profiles may pressure-test those interfaces without becoming normative.'
          )
          replace(
              'docs/implementation-guide/README.md',
              '- selection of specific proof constructions;',
              '- governed promotion of any experimental proof construction into a production or upstream profile;'
          )

          replace(
              'PROJECT-STATUS.yaml',
              '  validation_commands:\n    - git diff --check\n  evidence_outputs: []\n  known_limitations:\n    - upstream adoption of fork-local guidance is not asserted\n    - deployment-specific proof-system assurance remains outside repository authority\n',
              '  validation_commands:\n    - python3 scripts/validate_all.py\n    - pytest -q conformance-harness/tests\n  evidence_outputs:\n    - conformance-harness deterministic evidence\n    - experimental BBS construction evidence\n    - experimental PR-REL construction evidence\n    - experimental PR-HID construction evidence\n    - executable PR-RES profile fixtures\n  known_limitations:\n    - upstream adoption of fork-local guidance is not asserted\n    - experimental construction profiles are non-normative and not production-certified\n    - independent interoperability is incomplete for DTG-specific PR-REL, PR-HID and PR-RES profiles\n    - deployment-specific proof-system assurance remains outside repository authority\n'
          )

          replace(
              'RELEASE_NOTES_COMPOSED_PRESENTATION_PRIVACY.md',
              '## Deliberate non-decisions\n\nThe change does not select a ZK system, commitment scheme, accumulator, Merkle construction, selective-disclosure suite, revocation architecture or delegation-chain format. It preserves the v0.4 principle that semantic/privacy requirements are resolved before construction selection.\n\n## Tracking\n\nAddresses the implementation scope tracked in issue #4. The issue body is intentionally left unchanged; commits and the pull request provide implementation traceability.\n',
              '## Deliberate non-decisions and downstream validation\n\nThe requirements change itself does not select a ZK system, commitment scheme, accumulator, Merkle construction, selective-disclosure suite, revocation architecture or delegation-chain format. It preserves the v0.4 principle that semantic/privacy requirements are resolved before construction selection.\n\nAfter those requirements were completed, separate downstream pressure tests validated the interfaces without changing the semantic layer:\n\n- #7 added experimental W3C `bbs-2023` credential-side construction evidence;\n- #8 added an experimental `PR-REL` hidden-equality/relationship proof;\n- #10 added an experimental `PR-HID` randomized confidential-binder construction; and\n- #11 added explicit executable `PR-RES` resolution profiles rather than one universal status/registry construction.\n\nAll of these remain non-normative experiments with their own promotion and interoperability gates.\n\n## Tracking\n\nIssue #4 is complete and closed against its original construction-neutral acceptance criteria. Downstream construction/profile experiments were tracked separately in issue #9, which is also complete and closed.\n'
          )

          Path('RELEASE_NOTES_COMPOSED_PRIVACY_CONSTRUCTION_PROFILES.md').write_text('''# Composed-privacy construction and profile pressure tests\n\nThis change record summarizes the downstream experimental work that followed completion of the construction-neutral composed-presentation privacy requirements.\n\n## Evidence tracks\n\n- **BBS credential layer (`EXP-BBS-2023-01`)** — executable correctness/benchmark evidence plus externally sourced independent interoperability evidence for the BBS features actually covered by the W3C report.\n- **Cross-artifact relationship proof (`EXP-PR-REL-SIGMA-01`)** — Ristretto255 linear-relation Sigma proof with context-bound Fiat-Shamir transformation, positive/negative vectors and benchmark evidence.\n- **Confidential binder (`EXP-PR-HID-PEDERSEN-01`)** — randomized Ristretto255 Pedersen-style commitments, low-entropy dictionary-attack regression, opening tests, same-value unlinkability checks and benchmark evidence.\n- **External resolution (`PR-RES`)** — explicit machine-readable profiles for shared/cached Bitstring Status List evidence, carried authenticated snapshots and governed live lookup with declared privacy degradation.\n\n## Architectural result\n\nThe experiments support the separation established by the requirements work: semantic predicates define **what must be provable**, evidence interfaces expose authenticated proof inputs, and construction/profile choices define **how** the property is realized. No single cryptographic primitive is treated as the semantic definition of status, registry membership, accreditation, authorization or delegation.\n\n## Maturity boundary\n\nThese profiles are experimental and non-normative. Governed promotion, representative-device evidence and independent DTG-specific interoperability remain separate maturity gates.\n''', encoding='utf-8')
      - name: Commit synchronized documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md PROJECT-STATUS.yaml RELEASE_NOTES_COMPOSED_PRESENTATION_PRIVACY.md RELEASE_NOTES_COMPOSED_PRIVACY_CONSTRUCTION_PROFILES.md docs/implementation-guide/README.md
          git commit -m 'docs: synchronize composed-privacy construction state'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
